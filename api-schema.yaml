components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        customer:
          type: integer
          nullable: true
        service:
          type: integer
        professional:
          type: integer
        slot:
          type: integer
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/Status2d6Enum'
        cancelled_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - cancelled_by
      - client
      - created_at
      - id
      - professional
      - service
      - slot
    AppointmentDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status2d6Enum'
          readOnly: true
        notes:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        client_username:
          type: string
          readOnly: true
        client_email:
          type: string
          format: email
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/SalonCustomerMini'
          readOnly: true
        service:
          allOf:
          - $ref: '#/components/schemas/ServiceMini'
          readOnly: true
        professional:
          allOf:
          - $ref: '#/components/schemas/ProfessionalMini'
          readOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/ScheduleSlotMini'
          readOnly: true
      required:
      - client_email
      - client_username
      - created_at
      - customer
      - id
      - notes
      - professional
      - service
      - slot
      - status
    AppointmentRequest:
      type: object
      properties:
        customer:
          type: integer
          nullable: true
        service:
          type: integer
        professional:
          type: integer
        slot:
          type: integer
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/Status2d6Enum'
      required:
      - professional
      - service
      - slot
    AppointmentSeries:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_id:
          type: integer
          readOnly: true
        service_id:
          type: integer
          readOnly: true
        professional_id:
          type: integer
          readOnly: true
        notes:
          type: string
        recurrence_rule:
          type: string
        count:
          type: integer
          nullable: true
        until:
          type: string
          format: date
          nullable: true
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
          readOnly: true
      required:
      - appointments
      - client_id
      - id
      - professional_id
      - service_id
    AppointmentSeriesCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        series_id:
          type: integer
        appointment_ids:
          type: array
          items:
            type: integer
        appointments_created:
          type: integer
        total_value:
          type: number
          format: double
        service_name:
          type: string
        professional_name:
          type: string
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        message:
          type: string
      required:
      - appointment_ids
      - appointments
      - appointments_created
      - message
      - professional_name
      - series_id
      - service_name
      - success
      - total_value
    AppointmentSeriesOccurrenceCancelResponse:
      type: object
      properties:
        success:
          type: boolean
        series_id:
          type: integer
        appointment_id:
          type: integer
        message:
          type: string
      required:
      - appointment_id
      - message
      - series_id
      - success
    AppointmentSeriesUpdateActionEnum:
      enum:
      - cancel_all
      - edit_upcoming
      type: string
      description: |-
        * `cancel_all` - cancel_all
        * `edit_upcoming` - edit_upcoming
    AppointmentSeriesUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        series_id:
          type: integer
        action:
          type: string
        affected_count:
          type: integer
        appointment_ids:
          type: array
          items:
            type: integer
        message:
          type: string
      required:
      - action
      - affected_count
      - appointment_ids
      - message
      - series_id
      - success
    AvailableCreditPackagesResponse:
      type: object
      properties:
        packages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Lista de pacotes de créditos disponíveis
      required:
      - packages
    AvailablePlans:
      type: object
      description: Serializer para planos disponíveis.
      properties:
        plan_code:
          type: string
          description: Código do plano
        name:
          type: string
          description: Nome do plano
        price_monthly:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Preço mensal em euros
        features:
          type: array
          items:
            type: string
          description: Lista de funcionalidades do plano
        credits_included:
          type: integer
          description: Créditos de comunicação inclusos
        is_current:
          type: boolean
          description: Se é o plano atual do usuário
        can_upgrade:
          type: boolean
          description: Se pode fazer upgrade para este plano
      required:
      - can_upgrade
      - credits_included
      - features
      - is_current
      - name
      - plan_code
      - price_monthly
    BillingOverview:
      type: object
      description: Serializer para visão geral do billing.
      properties:
        current_subscription:
          allOf:
          - $ref: '#/components/schemas/CurrentSubscription'
          nullable: true
        available_plans:
          type: array
          items:
            $ref: '#/components/schemas/AvailablePlans'
        credit_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Saldo atual de créditos
        can_purchase_credits:
          type: boolean
          description: Se pode comprar créditos extras
        has_auto_renewal:
          type: boolean
          description: Se tem renovação automática de créditos
        next_billing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Próximo valor a ser cobrado
      required:
      - available_plans
      - can_purchase_credits
      - credit_balance
      - current_subscription
      - has_auto_renewal
      - next_billing_amount
    StripeSettingsUpdateRequest:
      type: object
      description: Payload para atualizar configurações de billing (Stripe).
      properties:
        auto_renewal:
          type: boolean
          description: Ativa/desativa renovação automática de créditos de comunicação
      required:
      - auto_renewal
    StripeSettingsResponse:
      type: object
      description: Resposta simplificada para configurações de billing (Stripe).
      properties:
        auto_renewal:
          type: boolean
          description: Estado atual da renovação automática de créditos de comunicação
      required:
      - auto_renewal
    BulkAppointmentRequest:
      type: object
      description: |-
        Serializer para criar múltiplos agendamentos de uma vez.

        Estrutura esperada:
        {
            "service_id": 1,
            "professional_id": 2,
            "client_name": "João Silva",
            "client_email": "joao@email.com",
            "client_phone": "+351912345678",
            "appointments": [
                {"slot_id": 10, "date": "2025-09-10", "time": "10:00"},
                {"slot_id": 15, "date": "2025-09-17", "time": "10:00"},
                {"slot_id": 20, "date": "2025-09-24", "time": "10:00"}
            ],
            "notes": "Curso de 3 sessões"
        }
      properties:
        service_id:
          type: integer
        professional_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        client_name:
          type: string
          minLength: 1
          maxLength: 100
        client_email:
          type: string
          format: email
          minLength: 1
        client_phone:
          type: string
          minLength: 1
          maxLength: 20
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/BulkAppointmentSlotRequest'
        notes:
          type: string
          maxLength: 500
      required:
      - appointments
      - professional_id
      - service_id
    BulkAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        appointment_ids:
          type: array
          items:
            type: integer
        appointments_created:
          type: integer
        total_value:
          type: number
          format: double
        service_name:
          type: string
        professional_name:
          type: string
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        message:
          type: string
      required:
      - appointment_ids
      - appointments
      - appointments_created
      - message
      - professional_name
      - service_name
      - success
      - total_value
    BulkAppointmentSlotRequest:
      type: object
      description: Serializer para cada slot individual em um agendamento múltiplo.
      properties:
        slot_id:
          type: integer
        date:
          type: string
          format: date
          description: Data do agendamento (YYYY-MM-DD)
        time:
          type: string
          format: time
          description: Horário do agendamento (HH:MM)
        notes:
          type: string
          maxLength: 500
      required:
      - slot_id
    CategoryEnum:
      enum:
      - notification_failure
      - security_incident
      - system
      type: string
      description: |-
        * `notification_failure` - Notification Failure
        * `security_incident` - Security Incident
        * `system` - System
    ChannelEnum:
      enum:
      - in_app
      - push_web
      - push_mobile
      - sms
      - whatsapp
      type: string
      description: |-
        * `in_app` - In-App
        * `push_web` - Web Push
        * `push_mobile` - Mobile Push
        * `sms` - SMS
        * `whatsapp` - WhatsApp
    CheckoutSessionRequestRequest:
      type: object
      properties:
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          description: |-
            Plano desejado

            * `basic` - basic
            * `standard` - standard
            * `pro` - pro
            * `enterprise` - enterprise
    CheckoutSessionResponse:
      type: object
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
          description: ID da sessão de checkout
      required:
      - checkout_url
      - session_id
    CommLedger:
      type: object
      description: Serializer para histórico de transações de crédito.
      properties:
        id:
          type: integer
          readOnly: true
        transaction_type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          readOnly: true
          description: |-
            Tipo de transação

            * `purchase` - Compra
            * `consumption` - Consumo
            * `expiration` - Expiração
            * `refund` - Reembolso
