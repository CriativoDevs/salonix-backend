openapi: 3.0.3
info:
  title: Salonix API
  version: 1.0.0
  description: Documentação dos relatórios e demais endpoints.
paths:
  /api/appointments/:
    post:
      operationId: appointments_create
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
          description: ''
  /api/appointments/{id}/cancel/:
    patch:
      operationId: appointments_cancel_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/ics/:
    get:
      operationId: appointments_ics_retrieve
      description: Gerar e retornar arquivo .ics para download.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ICS calendar file
  /api/appointments/bulk/:
    post:
      operationId: appointments_bulk_create
      description: |-
        POST /api/appointments/bulk/

        Criar múltiplos agendamentos em uma única transação atômica.
        Todos os agendamentos são criados ou nenhum é criado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAppointmentResponse'
          description: ''
  /api/appointments/series/:
    post:
      operationId: appointments_series_create
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesCreateResponse'
          description: ''
  /api/appointments/series/{id}/:
    get:
      operationId: appointments_series_retrieve
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeries'
          description: ''
    patch:
      operationId: appointments_series_partial_update
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesUpdateResponse'
          description: ''
  /api/appointments/series/{series_id}/occurrence/{occurrence_id}/cancel/:
    post:
      operationId: appointments_series_occurrence_cancel_create
      parameters:
      - in: path
        name: occurrence_id
        schema:
          type: integer
        required: true
      - in: path
        name: series_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesOccurrenceCancelResponse'
          description: ''
  /api/auth/credits/balance/:
    get:
      operationId: auth_credits_balance_retrieve
      description: Obtém saldo atual e estatísticas de créditos de comunicação
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
              examples:
                exemplo:
                  value:
                    current_balance: '19.90'
                    total_purchased: '50.00'
                    total_consumed: '30.10'
                    total_bonus: '0.00'
                    can_purchase_extra: true
                    has_auto_renewal: true
          description: ''
  /api/auth/credits/consume/:
    post:
      operationId: auth_credits_consume_create
      description: Consome créditos de comunicação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
            examples:
              exemplo:
                value:
                  amount: '0.045'
                  description: 'SMS para +351912345678'
                  reference_id: 'msg_abc123'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Créditos consumidos com sucesso
        '400':
          description: Saldo insuficiente ou dados inválidos
  /api/auth/credits/history/:
    get:
      operationId: auth_credits_history_list
      description: Lista histórico de transações de créditos de comunicação
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommLedger'
              examples:
                exemplo:
                  value:
                    - id: 1
                      transaction_type: purchase
                      amount_eur: '25.00'
                      balance_before: '0.00'
                      balance_after: '25.00'
                      status: completed
                      description: 'Recarga de créditos'
                      reference_id: 'pi_123'
                      expires_at: '2025-01-01T00:00:00Z'
                      created_by_username: 'owner@demo.local'
                      created_at: '2025-01-01T00:00:00Z'
                      updated_at: '2025-01-01T00:00:00Z'
          description: ''
  /api/auth/credits/purchase/:
    post:
      operationId: auth_credits_purchase_create
      description: Compra créditos de comunicação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Créditos adicionados com sucesso
        '400':
          description: Dados inválidos
        '403':
          description: Compra de créditos não permitida
  /api/auth/realtime/credits/:
    get:
      operationId: auth_realtime_credits_retrieve
      description: Stream SSE com atualizações de saldo/ledger por tenant
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                credit_update:
                  summary: Exemplo de evento SSE de crédito
                  value: |
                    event: credit_update
                    data: {"balance": "19.90", "type": "purchase"}

                    
          description: SSE stream de eventos de crédito
  /api/auth/me/features/:
    get:
      operationId: auth_me_features_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlags'
          description: ''
    put:
      operationId: auth_me_features_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlagsUpdate'
          description: ''
    patch:
      operationId: auth_me_features_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlagsUpdate'
          description: ''
  /api/auth/me/profile/:
    get:
      operationId: auth_me_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_me_profile_partial_update
      description: Atualiza preferência de tema do usuário
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme_preference:
                  type: string
                  enum:
                  - light
                  - dark
                  - system
                  description: Preferência de tema do usuário
              required:
              - theme_preference
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
          description: ''
  /api/auth/me/tenant/:
    get:
      operationId: auth_me_tenant_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Solicita um reset de senha. Resposta é neutra para não vazar existência.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Always ok
  /api/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Confirma o reset de senha com uid+token e define nova senha.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: password_updated
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/auth/staff/:
    get:
      operationId: auth_staff_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: auth_staff_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_staff_partial_update
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: auth_staff_destroy
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/staff/accept/:
    post:
      operationId: auth_staff_accept_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/tenant/meta/:
    get:
      operationId: auth_tenant_meta_retrieve
      description: Retornar metadados do tenant especificado
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMeta'
          description: ''
    patch:
      operationId: auth_tenant_meta_partial_update
      description: Atualizar branding do tenant (logo, cores)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMeta'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/me/appointments/:
    get:
      operationId: me_appointments_list
      description: |-
        Lista os agendamentos do usuário autenticado (como cliente).
        GET /api/me/appointments/
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      description: |-
        GET /api/notifications/

        Lista notificações in-app do usuário autenticado.
        Suporta filtros: ?is_read=false&limit=20
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/read/:
    put:
      operationId: notifications_read_update
      description: |-
        PATCH /api/notifications/{id}/read/

        Marca uma notificação como lida/não lida.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationMarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationMarkReadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarkRead'
          description: ''
    patch:
      operationId: notifications_read_partial_update
      description: |-
        PATCH /api/notifications/{id}/read/

        Marca uma notificação como lida/não lida.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationMarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationMarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationMarkReadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarkRead'
          description: ''
  /api/notifications/logs/:
    get:
      operationId: notifications_logs_list
      description: |-
        GET /api/notifications/logs/

        Lista logs de notificações (apenas para debug/admin).
        Endpoint privado para debugging.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationLog'
          description: ''
  /api/notifications/mark-all-read/:
    post:
      operationId: notifications_mark_all_read_create
      description: |-
        POST /api/notifications/mark-all-read/

        Marca todas as notificações não lidas do usuário como lidas.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarkAllReadResponse'
          description: ''
  /api/notifications/register_device/:
    post:
      operationId: notifications_register_device_create
      description: |-
        POST /api/notifications/register_device

        Registra ou atualiza um device token para push notifications.
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationDeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationDeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDevice'
          description: ''
  /api/notifications/stats/:
    get:
      operationId: notifications_stats_retrieve
      description: |-
        GET /api/notifications/stats

        Estatísticas de notificações do usuário.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatsResponse'
          description: ''
  /api/notifications/test/:
    post:
      operationId: notifications_test_create
      description: |-
        POST /api/notifications/test

        Testa um canal específico de notificação.
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationTestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationTestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResponse'
          description: ''
  /api/ops/alerts/:
    get:
      operationId: ops_alerts_list
      tags:
      - ops
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpsAlert'
          description: ''
  /api/ops/alerts/{id}/resolve/:
    post:
      operationId: ops_alerts_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ops alert.
        required: true
      tags:
      - ops
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsAlert'
          description: ''
  /api/ops/auth/login/:
    post:
      operationId: ops_auth_login_create
      tags:
      - ops
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/ops/auth/refresh/:
    post:
      operationId: ops_auth_refresh_create
      tags:
      - ops
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/ops/metrics/overview/:
    get:
      operationId: ops_metrics_overview_retrieve
      tags:
      - ops
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ops/support/clear-lockout/:
    post:
      operationId: ops_support_clear_lockout_create
      tags:
      - ops
      security:
      - jwtAuth: []
