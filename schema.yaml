  /api/salon/appointments/:
    get:
      operationId: salon_appointments_list
      description: |-
        Endpoints para o SALÃO visualizar e editar seus agendamentos.
        - list/retrieve: vê apenas agendamentos do próprio salão
          (match por professional.user == request.user OU service.user == request.user)
        - update/partial_update: permite editar SOMENTE o campo 'notes'
          (cancelamento continua pelo endpoint específico de cancelamento).
        - destroy: opcionalmente podemos permitir apagar; por padrão vou desabilitar abaixo.
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Idioma preferido da resposta (suportado: pt-PT, en)'
      - in: query
        name: limit
        schema:
          type: integer
        description: Quantidade por página (default=20, max=100)
      - in: query
        name: offset
        schema:
          type: integer
        description: Deslocamento de registros (default=0)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Ordenação: start_time, -start_time, created_at, -created_at,
          slot_time, -slot_time'
      tags:
      - salon
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: 'Lista paginada. Headers de resposta: X-Total-Count, X-Limit,
            X-Offset, Link (RFC 5988), Content-Language.'
    post:
      operationId: salon_appointments_create
      description: |-
        Endpoints para o SALÃO visualizar e editar seus agendamentos.
        - list/retrieve: vê apenas agendamentos do próprio salão
          (match por professional.user == request.user OU service.user == request.user)
        - update/partial_update: permite editar SOMENTE o campo 'notes'
          (cancelamento continua pelo endpoint específico de cancelamento).
        - destroy: opcionalmente podemos permitir apagar; por padrão vou desabilitar abaixo.
      tags:
      - salon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
