      summary: Relatórios Avançados - Disponível apenas para planos Pro e Enterprise
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Data/hora inicial (ISO-8601, UTC). Se ausente, usa período padrão
          de 30 dias antes da data final.
      - in: query
        name: interval
        schema:
          type: string
          enum:
          - day
          - month
          - week
        description: Agrupamento por período.
      - in: query
        name: limit
        schema:
          type: integer
        description: Limite de itens (padrão e máx. definidos em settings.REPORTS_PAGINATION).
      - in: query
        name: offset
        schema:
          type: integer
        description: Deslocamento para paginação.
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Data/hora final (ISO-8601, UTC). Se ausente, usa data/hora atual.
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  top_services:
                    type: object
                  revenue:
                    type: object
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
