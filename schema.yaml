      operationId: feedbacks_create
      summary: Criar feedback
      tags:
      - Feedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            examples:
              Request(anônimo):
                value:
                  category: praise
                  rating: 5
                  message: Excelente
                  is_anonymous: true
                  captcha_token: dev-bypass
                summary: Request (anônimo)
                description: Criação de feedback anônimo
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
              examples:
                Sucesso:
                  value:
                    id: 1
                    tenant: 1
                    category: praise
                    rating: 5
                    message: Excelente
                    is_anonymous: true
                    created_at: '2025-12-04T12:00:00Z'
                    updated_at: '2025-12-04T12:00:00Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                CaptchaInválido:
                  value:
                    detail: Captcha inválido.
                  summary: Captcha inválido
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                PermissãoNecessária:
                  value:
                    detail: Apenas owner pode criar feedback
                  summary: Permissão necessária
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DuplicadoRecente:
                  value:
                    detail: Feedback duplicado recente.
                  summary: Duplicado recente
          description: ''
