openapi: 3.0.3
info:
  title: TimelyOne API
  version: 1.0.0
  description: Documentação dos relatórios e demais endpoints.
paths:
  /api/appointments/:
    post:
      operationId: appointments_create
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
          description: ''
  /api/appointments/{id}/cancel/:
    patch:
      operationId: appointments_cancel_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/ics/:
    get:
      operationId: appointments_ics_retrieve
      description: Gerar e retornar arquivo .ics para download.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ICS calendar file
  /api/appointments/bulk/:
    post:
      operationId: appointments_bulk_create
      description: |-
        POST /api/appointments/bulk/

        Criar múltiplos agendamentos em uma única transação atômica.
        Todos os agendamentos são criados ou nenhum é criado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAppointmentResponse'
          description: ''
  /api/appointments/bulk/mixed/:
    post:
      operationId: appointments_bulk_mixed_create
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixedBulkAppointmentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MixedBulkAppointmentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MixedBulkAppointmentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MixedBulkAppointmentResponse'
          description: ''
  /api/appointments/series/:
    post:
      operationId: appointments_series_create
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesCreateResponse'
          description: ''
  /api/appointments/series/{id}/:
    get:
      operationId: appointments_series_retrieve
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeries'
          description: ''
    patch:
      operationId: appointments_series_partial_update
      description: Mixin que automaticamente filtra querysets por tenant do usuário
        logado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentSeriesUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesUpdateResponse'
          description: ''
  /api/appointments/series/{series_id}/occurrence/{occurrence_id}/cancel/:
    post:
      operationId: appointments_series_occurrence_cancel_create
      parameters:
      - in: path
        name: occurrence_id
        schema:
          type: integer
        required: true
      - in: path
        name: series_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSeriesOccurrenceCancelResponse'
          description: ''
  /api/auth/captcha/new/:
    get:
      operationId: auth_captcha_new_retrieve
      description: Retorna uma chave e uma URL de imagem para desafio captcha simples.
        A chave deve ser enviada junto com a resposta do usuário nos endpoints protegidos.
      summary: Gera novo desafio Captcha
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
          description: Desafio gerado com sucesso
        '429':
          description: Muitas solicitações (Rate Limit)
  /api/auth/credits/balance/:
    get:
      operationId: auth_credits_balance_retrieve
      description: Obtém saldo atual e estatísticas de créditos de comunicação
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
          description: ''
  /api/auth/credits/consume/:
    post:
      operationId: auth_credits_consume_create
      description: Consome créditos de comunicação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsumeCreditsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Créditos consumidos com sucesso
        '400':
          description: Saldo insuficiente ou dados inválidos
  /api/auth/credits/history/:
    get:
      operationId: auth_credits_history_list
      description: Lista histórico de transações de créditos de comunicação
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommLedgerList'
          description: ''
  /api/auth/credits/purchase/:
    post:
      operationId: auth_credits_purchase_create
      description: Compra créditos de comunicação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Créditos adicionados com sucesso
        '400':
          description: Dados inválidos
        '403':
          description: Compra de créditos não permitida
  /api/auth/me/features/:
    get:
      operationId: auth_me_features_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlags'
          description: ''
    put:
      operationId: auth_me_features_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserFeatureFlagsUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlagsUpdate'
          description: ''
    patch:
      operationId: auth_me_features_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserFeatureFlagsUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatureFlagsUpdate'
          description: ''
  /api/auth/me/profile/:
    get:
      operationId: auth_me_profile_retrieve
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Idioma preferido da resposta (suportado: pt-PT, en)'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
          description: 'Retorna perfil do usuário logado. Cabeçalho de resposta: Content-Language'
    patch:
      operationId: auth_me_profile_partial_update
      description: Atualiza preferência de tema do usuário ou status de onboarding
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme_preference:
                  type: string
                  enum:
                  - light
                  - dark
                  - system
                  description: Preferência de tema do usuário
                onboarding_status:
                  type: object
                  description: Status do onboarding do usuário (JSON)
              required: []
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
          description: ''
  /api/auth/me/tenant/:
    get:
      operationId: auth_me_tenant_retrieve
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Idioma preferido da resposta (suportado: pt-PT, en)'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSelfService'
          description: 'Retorna metadados do tenant do usuário logado. Cabeçalho de
            resposta: Content-Language'
    delete:
      operationId: auth_me_tenant_destroy
      description: Realiza o cancelamento (soft-delete) do tenant atual. Requer ser
        proprietário (Owner).
      summary: Cancelar conta
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Conta cancelada com sucesso
        '403':
          description: Apenas o proprietário pode cancelar a conta
        '404':
          description: Tenant não encontrado
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Envia email com link de redefinição. Requer captcha se CAPTCHA_ENABLED=True.
      summary: Solicitar Reset de Senha
      parameters:
      - in: header
        name: X-Captcha-Key
        schema:
          type: string
        description: Chave do captcha (alternativa ao body)
      - in: header
        name: X-Captcha-Value
        schema:
          type: string
        description: Valor do captcha (alternativa ao body)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
            examples:
              Exemplo:
                value:
                  email: user@example.com
                  reset_url: https://app/reset
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Solicitação processada (sempre OK para não vazar emails)
        '400':
          description: Captcha inválido ou email ausente
        '429':
          description: Rate Limit Excedido
  /api/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Confirma o reset de senha com uid+token e define nova senha.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            examples:
              Exemplo:
                value:
                  uid: '1'
                  token: <token>
                  new_password: StrongPass123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: password_updated
  /api/auth/realtime/credits/:
    get:
      operationId: auth_realtime_credits_retrieve
      description: 'Stream SSE com atualizações de saldo/ledger por tenant. Content-Type:
        text/event-stream. Eventos: heartbeat, credit_update.'
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: text/event-stream
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Cria novo usuário/tenant. Requer captcha se CAPTCHA_ENABLED=True.
      summary: Registro de usuário
      parameters:
      - in: header
        name: X-Captcha-Key
        schema:
          type: string
        description: Chave do captcha (alternativa ao body)
      - in: header
        name: X-Captcha-Value
        schema:
          type: string
        description: Valor do captcha (alternativa ao body)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
        '400':
          description: Erro de validação ou Captcha inválido
        '429':
          description: Rate Limit Excedido (verificar header Retry-After)
  /api/auth/staff/:
    get:
      operationId: auth_staff_list
      description: Lista membros de equipe do tenant autenticado
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantStaffMember'
          description: ''
    post:
      operationId: auth_staff_create
      description: Convida um membro de staff. Retorna token e expiração no payload.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffInviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
    patch:
      operationId: auth_staff_partial_update
      description: Atualiza dados do membro de equipe (papel, status, etc.)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
    delete:
      operationId: auth_staff_destroy
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/staff/accept/:
    post:
      operationId: auth_staff_accept_create
      description: Aceita convite de membro de equipe e ativa o acesso
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAcceptInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffAcceptInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffAcceptInviteRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
  /api/auth/staff/access-link/:
    post:
      operationId: auth_staff_access_link_create
      description: Envia link de acesso ao painel via redefinição de senha
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              Payload:
                value:
                  id: 123
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
  /api/auth/staff/contact/:
    patch:
      operationId: auth_staff_contact_partial_update
      description: Atualiza informações de contato do membro de equipe
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffContactUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffContactUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffContactUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
  /api/auth/staff/resend/:
    post:
      operationId: auth_staff_resend_create
      description: Reenvia convite para membro convidado. Gera novo token e expiração.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              Payload:
                value:
                  id: 123
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStaffMember'
          description: ''
  /api/auth/tenant/meta/:
    get:
      operationId: auth_tenant_meta_retrieve
      description: Retornar metadados do tenant especificado
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Idioma preferido da resposta (suportado: pt-PT, en)'
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMeta'
          description: 'Retorna metadados do tenant. Cabeçalho de resposta: Content-Language'
    patch:
      operationId: auth_tenant_meta_partial_update
      description: Atualizar branding do tenant (logo, favicon_url, app_name)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantBrandingUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMeta'
          description: ''
  /api/auth/tenant/modules/:
    patch:
      operationId: auth_tenant_modules_partial_update
      description: 'Atualiza módulos do tenant (ex.: PWA Cliente). Só permitido para
        owner/manager e plano Standard+.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantModulesUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantModulesUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantModulesUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: ok
  /api/auth/tenant/notifications/:
    patch:
