      responses:
        '200':
          description: ok
  /api/users/tenant/profile/:
    get:
      operationId: users_tenant_profile_retrieve
      description: |-
        GET /api/users/tenant/profile/
        PATCH /api/users/tenant/profile/

        Endpoint para obter/atualizar dados de contato do tenant (email/telefone).
        GET é público (resolve via 'tenant' ou 'X-Tenant-Slug'); PATCH exige owner/manager.
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: 'Idioma preferido da resposta (suportado: pt-PT, en)'
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'
          description: 'Retorna dados de contato do tenant. Cabeçalho de resposta:
            Content-Language'
    patch:
      operationId: users_tenant_profile_partial_update
      description: |-
        GET /api/users/tenant/profile/
        PATCH /api/users/tenant/profile/

        Endpoint para obter/atualizar dados de contato do tenant (email/telefone).
        GET é público (resolve via 'tenant' ou 'X-Tenant-Slug'); PATCH exige owner/manager.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'
          description: ''
  /api/users/token/:
    post:
      operationId: users_token_create
      description: Obtém par de tokens (access/refresh) + contexto do tenant. Requer
        captcha se CAPTCHA_ENABLED=True.
      summary: Login (JWT)
      parameters:
      - in: header
        name: X-Captcha-Key
        schema:
          type: string
        description: Chave do captcha (alternativa ao body)
      - in: header
        name: X-Captcha-Value
        schema:
          type: string
        description: Valor do captcha (alternativa ao body)
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
          description: ''
        '400':
          description: Credenciais inválidas ou Captcha inválido
        '401':
          description: Não autorizado
        '429':
          description: Rate Limit Excedido (verificar header Retry-After)
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
